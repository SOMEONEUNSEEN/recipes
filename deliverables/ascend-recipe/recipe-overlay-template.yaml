# - model、compatible_strategies、顶层 guide、opt_in_features、
#   kv_offload_support、troubleshooting、default_strategy、pool_modes；
# - meta.title/model/default_hardware/default_variant 或用于替换 base 的
#   default variant（本 overlay 仅使用 meta.hardware/date_updated）；
# - NVIDIA/AMD 硬件 key、CUDA/NCCL 专属配置、非 Huawei dependency；
# - 与策略/preset 合成器冲突的 raw TP/PP/DP 参数、旧 launcher/grouped 字段；
# - 用 unsupported 表示未测试、未验证的性能声明、生成的 public/.content 文件。
#
# 提交前逐项确认：
# 1. 所有 __PLACEHOLDER__ 已替换，不支持的选配块已删除。
# 2. 所有新增 variant 的 precision/vram/supported_hardware 完整，量化 label、
#    内部 precision、checkpoint 和 runtime quantization 映射一致。
# 3. 所有省略字段的默认值确实符合目标模型，而不是因为“可以不写”就忽略。
# 4. 所有 override 都位于正确层级，没有 scalar→map promotion 或跨品牌修改。
# 5. Ascend PD 的两个 select、拓扑、remove_args、镜像、source 和全部节点
#    命令均经过严格渲染与实际环境验证。
